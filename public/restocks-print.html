<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Restocks</title>
<style>
  *{box-sizing:border-box;} body{font-family:"Segoe UI",Tahoma,sans-serif;color:#111;margin:0;background:#f4f4f4;}
  .sheet{width:900px;max-width:97%;margin:14px auto;background:#fff;padding:24px 26px;}
  h1{color:#1f7a44;margin:0 0 2px;font-size:22px;} .sub{color:#666;font-size:13px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;} th{background:#1f7a44;color:#fff;text-align:left;padding:6px 8px;font-size:12px;}
  th.num,td.num{text-align:right;} td{padding:6px 8px;border-bottom:1px solid #e6e6e6;font-size:12.5px;}
  .toolbar{text-align:center;margin:14px;} .toolbar input,.toolbar button{font-size:14px;padding:8px 10px;margin:0 4px;border-radius:6px;}
  .toolbar button{background:#1f7a44;color:#fff;border:0;cursor:pointer;}
  @media print{ body{background:#fff;} .noprint{display:none;} .sheet{margin:0;} @page{ size:A4 portrait; margin:9mm; } }
</style></head><body>
<div class="sheet" id="sheet">
  <h1 id="co">Restocks</h1>
  <div class="sub" id="range"></div>
  <table><thead><tr><th>Date</th><th>Product</th><th>Code</th><th>To</th><th class="num">Qty added</th><th>By</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="sub" style="margin-top:12px" id="foot"></div>
</div>
<div class="toolbar noprint">
  <label>From <input type="date" id="from"></label>
  <label>To <input type="date" id="to"></label>
  <button onclick="reload()">Apply</button>
  <button onclick="window.print()">🖨️ Print</button>
</div>
<script>
  var apiBase=localStorage.getItem("apiBase"),token=localStorage.getItem("token"),companyId=localStorage.getItem("companyId");
  var params=new URLSearchParams(location.search);
  function esc(t){return String(t==null?"":t).replace(/[&<>"\x27]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c];});}
  function reload(){
    var f=document.getElementById("from").value,t=document.getElementById("to").value;
    var q=new URLSearchParams({}); if(f)q.set("from",f); if(t)q.set("to",t);
    location.search=q.toString();
  }
  (async function(){
    var f=params.get("from")||"",t=params.get("to")||"";
    document.getElementById("from").value=f; document.getElementById("to").value=t;
    document.getElementById("range").textContent = (f||t) ? ("From "+(f||"start")+" to "+(t||"today")) : "All restocks (most recent first)";
    if(!apiBase){document.getElementById("sheet").innerHTML="<p style=padding:20px>Open from the app.</p>";return;}
    try{
      var qs=new URLSearchParams({type:"restock"}); if(f)qs.set("from",f); if(t)qs.set("to",t);
      var res=await fetch(apiBase+"/stock/movements?"+qs.toString(),{headers:{"Authorization":"Bearer "+token,"X-Company-Id":companyId}});
      var list=await res.json(); var tb=document.getElementById("rows"); var total=0;
      list.forEach(function(m){
        total+=Number(m.quantity||0);
        var r=document.createElement("tr");
        r.innerHTML='<td>'+new Date(m.created_at).toLocaleString("en-NG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})+'</td>'+
          '<td>'+esc(m.product_name)+'</td><td>'+esc(m.product_code)+'</td><td>'+esc(m.to_branch||"")+'</td>'+
          '<td class="num">'+Number(m.quantity||0)+'</td><td>'+esc(m.done_by||"")+'</td>';
        tb.appendChild(r);
      });
      document.getElementById("foot").textContent=list.length+" restock entries · "+total.toLocaleString("en-NG")+" units added";
      if(list.length && (f||t)) setTimeout(function(){window.print();},500);
    }catch(e){document.getElementById("sheet").innerHTML="<p style=padding:20px>Could not load restocks.</p>";}
  })();
</script></body></html>
