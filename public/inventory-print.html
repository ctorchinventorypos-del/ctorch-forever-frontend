<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory list</title>
<style>
  *{box-sizing:border-box;} body{font-family:"Segoe UI",Tahoma,sans-serif;color:#111;margin:0;background:#f4f4f4;}
  .sheet{width:900px;max-width:97%;margin:14px auto;background:#fff;padding:24px 26px;}
  h1{color:#1f7a44;margin:0 0 2px;font-size:22px;} .sub{color:#666;font-size:13px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;} th{background:#1f7a44;color:#fff;text-align:left;padding:6px 8px;font-size:12px;}
  th.num,td.num{text-align:right;} td{padding:6px 8px;border-bottom:1px solid #e6e6e6;font-size:12.5px;}
  .cat{background:#eef6f0;font-weight:700;color:#1f7a44;}
  .low{color:#b9512f;font-weight:700;}
  .toolbar{text-align:center;margin:14px;} .toolbar button{background:#1f7a44;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;}
  @media print{ body{background:#fff;} .noprint{display:none;} .sheet{margin:0;} @page{ size:A4 portrait; margin:9mm; } }
</style></head><body>
<div class="sheet" id="sheet">
  <h1 id="co">Inventory</h1>
  <div class="sub">Full stock list · <span id="when"></span></div>
  <table><thead><tr><th>Product</th><th>Code</th><th class="num">Selling price</th><th class="num">In stock</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div class="sub" style="margin-top:12px" id="foot"></div>
</div>
<div class="toolbar noprint"><button onclick="window.print()">🖨️ Print</button></div>
<script>
  var apiBase=localStorage.getItem("apiBase"),token=localStorage.getItem("token"),companyId=localStorage.getItem("companyId");
  var naira=function(n){return "\u20a6"+Number(n||0).toLocaleString("en-NG");};
  function esc(t){return String(t==null?"":t).replace(/[&<>"\x27]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c];});}
  (async function(){
    if(!apiBase){document.getElementById("sheet").innerHTML="<p style=padding:20px>Open from the app.</p>";return;}
    try{
      var res=await fetch(apiBase+"/products",{headers:{"Authorization":"Bearer "+token,"X-Company-Id":companyId}});
      var list=await res.json();
      document.getElementById("when").textContent=new Date().toLocaleString("en-NG",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
      // group by category
      var groups={}; list.forEach(function(p){ var k=p.category_name||"Uncategorised"; (groups[k]=groups[k]||[]).push(p); });
      var tb=document.getElementById("rows"); var totalUnits=0, totalItems=0;
      Object.keys(groups).sort().forEach(function(cat){
        var tr=document.createElement("tr"); tr.innerHTML='<td class="cat" colspan="4">'+esc(cat)+'</td>'; tb.appendChild(tr);
        groups[cat].forEach(function(p){
          totalItems++; totalUnits+=Number(p.total_stock||0);
          var low = p.reorder_level!=null && p.total_stock<=p.reorder_level;
          var r=document.createElement("tr");
          r.innerHTML='<td>'+esc(p.name)+'</td><td>'+esc(p.product_code)+'</td><td class="num">'+naira(p.recommended_price)+'</td>'+
            '<td class="num'+(low?' low':'')+'">'+Number(p.total_stock||0)+' '+esc(p.unit||'')+(low?' ⚠':'')+'</td>';
          tb.appendChild(r);
        });
      });
      document.getElementById("foot").textContent=totalItems+" products · "+totalUnits.toLocaleString("en-NG")+" units in stock";
      setTimeout(function(){window.print();},500);
    }catch(e){document.getElementById("sheet").innerHTML="<p style=padding:20px>Could not load inventory.</p>";}
  })();
</script></body></html>
